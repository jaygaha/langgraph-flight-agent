name: CI

# on: push: branches - only runs CI on branches you care about. Prevents CI firing on every experimental branch.
on:
  push:
    branches:
    - main
    - "feat/*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # checks out current repo code into the runner. Without this, there's nothing to test.
      - uses: actions/checkout@v4

      # installs Python 3.14 on the runner, matching your Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # LLM_PROVIDER: ollama in env - src/config.py reads this at import time.
        # Setting it prevents a ValidationError from Pydantic Settings when the runner has no .env file.
        env:
          LLM_PROVIDER: ollama
          LLM_MODEL: llama3.1
        run: pytest tests/ -v
