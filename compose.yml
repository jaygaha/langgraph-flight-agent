services:
  agent:
    container_name: flight_agent
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - checkpoints:/app/data
#    depends_on:
#      - ollama
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=gemma4:e4b
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CHECKPOINT_DB=/app/data/checkpoints.db

